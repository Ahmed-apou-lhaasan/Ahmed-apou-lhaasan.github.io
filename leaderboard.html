<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأوائل | منصة الأستاذ أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<main class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="display text-3xl mb-1">🏆 الأوائل</h1>
  <p class="mb-6" style="color:var(--ink-2)">الطالب الأول في كل مرحلة</p>

  <div id="topList" class="flex flex-col gap-4">
    <div class="item-card skeleton h-20"></div>
  </div>
</main>

<div id="app-footer"></div>

<script type="module">
  import { mountLayout, escapeHtml, GRADE_LABELS } from "/assets/js/main.js";
  import { db, collection, getDocs, query, where } from "/assets/js/firebase-config.js";

  mountLayout();

  const grades = ["1", "2", "3", "grammar"];
  const topList = document.getElementById("topList");

  async function computeTopForGrade(grade) {
    const q = query(collection(db, "examResults"), where("grade", "==", grade));
    const snap = await getDocs(q);
    if (snap.empty) return null;
    const byStudent = {};
    snap.forEach(docu => {
      const r = docu.data();
      const key = r.studentId || r.studentName;
      if (!byStudent[key]) {
        byStudent[key] = { name: r.studentName || "طالب", totalScore: 0, totalPossible: 0, examCount: 0 };
      }
      byStudent[key].totalScore += Number(r.score) || 0;
      byStudent[key].totalPossible += Number(r.total) || 0;
      byStudent[key].examCount += 1;
    });
    const ranked = Object.values(byStudent)
      .filter(s => s.totalPossible > 0)
      .map(s => ({ ...s, pct: Math.round((s.totalScore / s.totalPossible) * 100) }))
      .sort((a, b) => b.examCount - a.examCount || b.pct - a.pct);
    return ranked[0] || null;
  }

  async function loadTops() {
    topList.innerHTML = `<div class="item-card skeleton h-20"></div>`;
    const results = await Promise.all(grades.map(g => computeTopForGrade(g)));
    topList.innerHTML = "";
    let any = false;
    grades.forEach((g, i) => {
      const top = results[i];
      if (!top) return;
      any = true;
      topList.insertAdjacentHTML("beforeend", `
        <div class="item-card p-5" style="background:linear-gradient(135deg, var(--gold-light), var(--gold))">
          <span class="text-4xl">🥇</span>
          <div class="flex-1">
            <div class="text-xs" style="color:#fff;opacity:.85">${GRADE_LABELS[g] || g}</div>
            <div class="font-bold text-lg" style="color:#fff">${escapeHtml(top.name)}</div>
            <div class="text-xs" style="color:#fff;opacity:.9">${top.examCount} امتحان · ${top.pct}%</div>
          </div>
        </div>`);
    });
    if (!any) {
      topList.innerHTML = `<p class="text-sm opacity-60">لا توجد نتائج كافية بعد لتحديد الأوائل.</p>`;
    }
  }

  loadTops();
</script>
</body>
</html>
