<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدروس والامتحانات | منصة الأستاذ أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<main class="max-w-4xl mx-auto px-4 py-8">
  <h1 id="pageTitle" class="display text-3xl mb-1">...</h1>
  <p class="mb-8" style="color:var(--ink-2)">اختر درساً لتبدأ، أو ادخل امتحاناً لاختبار نفسك</p>

  <section class="mb-10">
    <h2 class="text-xl font-bold mb-3" style="color:var(--ink-2)">📘 الدروس</h2>
    <div id="branchPills" class="pill-row"></div>
    <div id="lessonsList" class="flex flex-col gap-5">
      <div class="item-card skeleton h-16"></div>
      <div class="item-card skeleton h-16"></div>
    </div>
    <p id="noLessons" class="hidden text-sm opacity-60 mt-2">لا توجد دروس مضافة بعد في هذا القسم.</p>
  </section>

  <section class="mb-10">
    <h2 class="text-xl font-bold mb-3" style="color:var(--ink-2)">🎯 تحدي المرحلة</h2>
    <div id="challengeList" class="flex flex-col gap-3">
      <div class="item-card skeleton h-16"></div>
    </div>
    <p id="noChallenge" class="hidden text-sm opacity-60 mt-2">لا يوجد تحدي متاح حالياً.</p>
  </section>

  <section class="mb-10">
    <h2 class="text-xl font-bold mb-3" style="color:var(--ink-2)">📚 الواجبات</h2>
    <div id="homeworkList" class="flex flex-col gap-3">
      <div class="item-card skeleton h-16"></div>
    </div>
    <p id="noHomework" class="hidden text-sm opacity-60 mt-2">لا توجد واجبات مضافة بعد في هذا القسم.</p>
  </section>

  <section>
    <h2 class="text-xl font-bold mb-3" style="color:var(--ink-2)">📝 الامتحانات</h2>
    <div id="examsList" class="flex flex-col gap-3">
      <div class="item-card skeleton h-16"></div>
    </div>
    <p id="noExams" class="hidden text-sm opacity-60 mt-2">لا توجد امتحانات مضافة بعد في هذا القسم.</p>
  </section>
</main>

<div id="app-footer"></div>

<script type="module">
  import { mountLayout, GRADE_LABELS, escapeHtml, getStudentSession } from "/assets/js/main.js";
  import { db, collection, getDocs, query, where } from "/assets/js/firebase-config.js";

  mountLayout();

  const studentSession = getStudentSession();
  if (!studentSession) {
    location.replace("/student-login.html");
  }
  const params = new URLSearchParams(location.search);
  const grade = params.get("grade") || "1";
  if (studentSession && studentSession.grade !== grade) {
    location.replace(`/grade.html?grade=${studentSession.grade}`);
  }
  document.getElementById("pageTitle").textContent = GRADE_LABELS[grade] || "الدروس";

  const DAY = 24 * 60 * 60 * 1000;
  const BRANCHES = ["نحو", "نصوص", "قراءة", "بلاغة", "قصة"];
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSekHyyW4bzLLTTs0ArEW0Q5OAjChLXEvCgYiNB8LfsMe6IGew/viewform";

  let allLessons = [];
  let resultsByExam = {};
  let activeBranch = "";

  async function loadMyResults() {
    if (!studentSession) return;
    try {
      const snap = await getDocs(query(collection(db, "examResults"), where("studentId", "==", studentSession.id)));
      snap.forEach(docu => {
        const r = docu.data();
        if (r.examId) resultsByExam[r.examId] = r;
      });
    } catch (e) {
      console.error(e);
    }
  }

  function renderPills() {
    const box = document.getElementById("branchPills");
    const items = [{ v: "", label: "الكل" }, ...BRANCHES.map(b => ({ v: b, label: b }))];
    box.innerHTML = items.map(i =>
      `<button type="button" class="pill ${activeBranch === i.v ? "active" : ""}" data-branch="${i.v}">${i.label}</button>`
    ).join("");
    box.querySelectorAll("[data-branch]").forEach(b => {
      b.addEventListener("click", () => {
        activeBranch = b.dataset.branch;
        renderPills();
        renderLessons();
      });
    });
  }

  function renderLessons() {
    const box = document.getElementById("lessonsList");
    const none = document.getElementById("noLessons");
    const visible = allLessons.filter(l => !activeBranch || l.branch === activeBranch);
    box.innerHTML = "";
    if (visible.length === 0) {
      none.textContent = activeBranch
        ? `لا توجد دروس في فرع "${activeBranch}" بعد.`
        : "لا توجد دروس مضافة بعد في هذا القسم.";
      none.classList.remove("hidden");
      return;
    }
    none.classList.add("hidden");

    visible.forEach(d => {
      const featured = allLessons[0] && d.id === allLessons[0].id;
      const fresh = d.createdAt && (Date.now() - d.createdAt) < 3 * DAY;
      const date = d.createdAt ? new Date(d.createdAt).toLocaleDateString("ar-EG") : "";
      const pdfUrl = d.pdfUrl || (d.type === "pdf" ? d.content : "");
      const hasExplain = d.type !== "pdf";
      const result = d.examId ? resultsByExam[d.examId] : null;

      const flagHtml = featured
        ? `<span class="unit-flag">${fresh ? "🔥 جديد" : "✨ الأحدث"}</span>`
        : (fresh ? `<span class="unit-flag mild">🆕 جديد</span>` : "");
      const tagHtml = d.branch ? `<span class="unit-tag">${escapeHtml(d.branch)}</span>` : "";
      const dateHtml = date ? `<span>${date}</span>` : "";

      let statusHtml = "";
      if (d.examId) {
        if (result) {
          const pct = result.total ? Math.round((result.score / result.total) * 100) : 0;
          statusHtml = `<span class="unit-status done">✅ تم الإنجاز · ${result.score}/${result.total} (${pct}%)</span>`;
        } else {
          statusHtml = `<span class="unit-status todo">⏳ لم يكتمل</span>`;
        }
      }

      const actions = [];
      if (hasExplain) {
        actions.push(`<a class="unit-btn explain" href="/lesson.html?id=${d.id}">${d.type === "video" ? "🎬" : "📖"} الشرح</a>`);
      }
      if (pdfUrl) {
        actions.push(`<a class="unit-btn pdf" href="${escapeHtml(pdfUrl)}" target="_blank" rel="noopener">📄 الملزمة</a>`);
      }
      if (d.examId) {
        actions.push(`<a class="unit-btn exam" href="/exam.html?id=${d.examId}">🏆 ${result ? "نتيجة الامتحان" : "امتحان الدرس"}</a>`);
      }
      if (actions.length === 0) {
        actions.push(`<a class="unit-btn explain" href="/lesson.html?id=${d.id}">📖 الشرح</a>`);
      }

      box.insertAdjacentHTML("beforeend", `
        <div class="unit-card ${featured ? "featured" : ""} ${result ? "completed" : ""}">
          ${flagHtml}
          <div class="unit-head">
            <div class="unit-num">${d.seq}</div>
            <div class="flex-1">
              <div class="unit-title">${escapeHtml(d.title || "بدون عنوان")}</div>
              <div class="unit-meta">${tagHtml}${dateHtml}</div>
            </div>
          </div>
          ${statusHtml}
          <div class="unit-actions">${actions.join("")}</div>
        </div>`);
    });
  }

  async function loadLessons() {
    const box = document.getElementById("lessonsList");
    try {
      const [snap] = await Promise.all([
        getDocs(query(collection(db, "lessons"), where("grade", "==", grade))),
        loadMyResults()
      ]);
      const rows = [];
      snap.forEach(docu => rows.push({ id: docu.id, ...docu.data() }));
      rows.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      rows.forEach((r, i) => { r.seq = i + 1; });
      allLessons = rows.slice().reverse();
      renderPills();
      renderLessons();
    } catch (e) {
      box.innerHTML = `<p class="text-sm" style="color:var(--danger)">تعذّر تحميل الدروس. تأكد من إعداد Firebase بشكل صحيح.</p>`;
      console.error(e);
    }
  }

  async function loadChallenge() {
    const box = document.getElementById("challengeList");
    try {
      const q2 = query(collection(db, "challenges"), where("grade", "==", grade));
      const snap2 = await getDocs(q2);
      const today = new Date().toISOString().slice(0, 10);
      const active = [];
      snap2.forEach(docu => {
        const d = docu.data();
        if (!d.expiresAt || d.expiresAt >= today) active.push(d);
      });
      if (active.length === 0) {
        box.innerHTML = "";
        document.getElementById("noChallenge").classList.remove("hidden");
        return;
      }
      active.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      box.innerHTML = "";
      active.forEach(d => {
        const expiresLine = d.expiresAt ? `<div class="text-xs opacity-60 mt-1">ينتهي في: ${escapeHtml(d.expiresAt)}</div>` : "";
        box.insertAdjacentHTML("beforeend", `
          <div class="item-card items-start" style="background:linear-gradient(135deg, var(--ink), var(--ink-2))">
            <span class="text-2xl">🎯</span>
            <div class="flex-1">
              <div class="font-bold" style="color:var(--paper)">${escapeHtml(d.title || "تحدي")}</div>
              <div class="text-sm mt-1 whitespace-pre-wrap" style="color:var(--paper);opacity:.9">${escapeHtml(d.content || "")}</div>
              ${expiresLine}
            </div>
            <span class="badge" style="background:var(--gold);color:#fff">⭐ ${d.xpReward || 0} نقطة</span>
          </div>`);
      });
    } catch (e) {
      box.innerHTML = `<p class="text-sm" style="color:var(--danger)">تعذّر تحميل التحدي.</p>`;
      console.error(e);
    }
  }

  async function loadHomework() {
    const box = document.getElementById("homeworkList");
    try {
      const q = query(collection(db, "homework"), where("grade", "==", grade));
      const snap = await getDocs(q);
      if (snap.empty) {
        box.innerHTML = "";
        document.getElementById("noHomework").classList.remove("hidden");
        return;
      }
      const rows = [];
      snap.forEach(docu => rows.push(docu.data()));
      rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      box.innerHTML = "";
      rows.forEach(d => {
        const dueLine = d.dueDate ? `<div class="text-xs opacity-60 mt-1">آخر موعد للتسليم: ${escapeHtml(d.dueDate)}</div>` : "";
        box.insertAdjacentHTML("beforeend", `
          <div class="item-card items-start">
            <span class="text-2xl">📚</span>
            <div class="flex-1">
              <div class="font-bold">${escapeHtml(d.title || "واجب")}</div>
              <div class="text-sm mt-1 whitespace-pre-wrap" style="color:var(--ink-2)">${escapeHtml(d.content || "")}</div>
              ${dueLine}
              <a href="${FORM_URL}" target="_blank" class="btn btn-gold btn-sm mt-3 inline-flex">📤 قدّم الواجب</a>
            </div>
          </div>`);
      });
    } catch (e) {
      box.innerHTML = `<p class="text-sm" style="color:var(--danger)">تعذّر تحميل الواجبات.</p>`;
      console.error(e);
    }
  }

  async function loadExams() {
    const box = document.getElementById("examsList");
    try {
      const q = query(collection(db, "exams"), where("grade", "==", grade));
      const snap = await getDocs(q);
      if (snap.empty) {
        box.innerHTML = "";
        document.getElementById("noExams").classList.remove("hidden");
        return;
      }
      box.innerHTML = "";
      snap.forEach(docu => {
        const d = docu.data();
        const isNewExam = d.createdAt && (Date.now() - d.createdAt) < 3 * DAY;
        const newBadge = isNewExam ? `<span class="badge" style="background:#fdecea;color:var(--clay)">🆕 جديد</span>` : "";
        const done = resultsByExam[docu.id];
        const actionBadge = done
          ? `<span class="badge" style="background:rgba(67,170,139,.22);color:var(--success)">✅ تم الحل ${done.score}/${done.total}</span>`
          : `<span class="badge badge-exam">ابدأ الامتحان</span>`;
        box.insertAdjacentHTML("beforeend", `
          <a href="/exam.html?id=${docu.id}" class="item-card">
            <span class="text-2xl">📝</span>
            <div class="flex-1">
              <div class="font-bold">${escapeHtml(d.title || "امتحان")}</div>
              <div class="text-xs opacity-60">${(d.questions || []).length} سؤال</div>
            </div>
            ${newBadge}
            ${actionBadge}
          </a>`);
      });
    } catch (e) {
      box.innerHTML = `<p class="text-sm" style="color:var(--danger)">تعذّر تحميل الامتحانات.</p>`;
      console.error(e);
    }
  }

  (async () => {
    await loadLessons();
    loadChallenge();
    loadHomework();
    loadExams();
  })();
</script>
</body>
</html>
