<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان | منصة الأستاذ أحمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<main class="max-w-2xl mx-auto px-4 py-8">
  <a id="backLink" href="/index.html" class="text-sm" style="color:var(--gold)">→ الرجوع للقسم</a>
  <h1 id="examTitle" class="display text-3xl my-4">جاري التحميل...</h1>
  <div id="examTimer" class="hidden mb-4 text-center p-3 rounded-xl font-bold text-lg" style="background:var(--paper-2)"></div>
  <!-- شاشة إدخال اسم الطالب -->
  <div id="nameGate" class="hidden mb-6">
    <label class="field-label">اكتب اسمك قبل بدء الامتحان</label>
    <input id="studentName" class="field" placeholder="الاسم بالكامل">
  </div>

  <form id="examForm" class="flex flex-col gap-6"></form>

  <div class="mt-6 flex items-center gap-3">
    <button id="submitBtn" class="btn btn-primary hidden">تسليم الامتحان</button>
  </div>

  <div id="resultBox" class="hidden mt-8 p-6 rounded-2xl text-center" style="background:var(--paper-2); border:1px solid var(--line)">
    <div class="text-sm mb-1" style="color:var(--ink-2)">نتيجتك</div>
    <div id="scoreText" class="display text-4xl"></div>
  </div>
</main>

<div id="app-footer"></div>

<script type="module">
  import { mountLayout, escapeHtml, getStudentSession } from "/assets/js/main.js";
  import { db, doc, getDoc, collection, addDoc, getDocs, query, where } from "/assets/js/firebase-config.js";

  mountLayout();

  const id = new URLSearchParams(location.search).get("id");
  const titleEl = document.getElementById("examTitle");
  const form = document.getElementById("examForm");
  const submitBtn = document.getElementById("submitBtn");
  const session = getStudentSession();
  let examData = null;

  async function checkAlreadyTaken() {
    if (!session) return null;
    const q = query(collection(db, "examResults"), where("studentId", "==", session.id));
    const snap = await getDocs(q);
    let found = null;
    snap.forEach(docu => {
      const d = docu.data();
      if (d.examId === id) found = d;
    });
    return found;
  }

  async function load() {
    if (!session) { location.replace("/student-login.html"); return; }
    if (!id) { titleEl.textContent = "لم يتم تحديد الامتحان"; return; }
    try {
      const snap = await getDoc(doc(db, "exams", id));
      if (!snap.exists()) { titleEl.textContent = "الامتحان غير موجود"; return; }
      examData = snap.data();
      if (session && session.grade !== examData.grade) {
        titleEl.textContent = "هذا الامتحان غير متاح لمرحلتك";
        return;
      }
      document.getElementById("backLink").href = `/grade.html?grade=${examData.grade}`;
      titleEl.textContent = examData.title || "امتحان";

      const previous = await checkAlreadyTaken();
      if (previous) {
        const pct = previous.total ? Math.round((previous.score / previous.total) * 100) : 0;
        document.getElementById("nameGate").innerHTML =
          `<p class="text-sm" style="color:var(--ink-2)">
             لقد حللت هذا الامتحان من قبل. نتيجتك كانت:
           </p>`;
        document.getElementById("nameGate").classList.remove("hidden");
        document.getElementById("resultBox").classList.remove("hidden");
        document.getElementById("scoreText").textContent = `${previous.score} / ${previous.total} (${pct}%)`;
        return;
      }

      if (session) {
        document.getElementById("nameGate").innerHTML =
          `<p class="text-sm" style="color:var(--ink-2)">مسجل دخول باسم: <span class="font-bold">${escapeHtml(session.name)}</span></p>`;
      }
      document.getElementById("nameGate").classList.remove("hidden");

      (examData.questions || []).forEach((q, i) => {
        const opts = q.type === "tf" ? ["صح", "خطأ"] : (q.options || []);
        const optionsHtml = opts.map((opt, oi) => `
          <label class="option-row">
            <input type="radio" name="q${i}" value="${oi}" class="accent-current">
            <span>${escapeHtml(opt)}</span>
          </label>`).join("");

        form.insertAdjacentHTML("beforeend", `
          <fieldset data-qindex="${i}" class="border-0 p-0">
            <legend class="font-bold mb-3">${i + 1}. ${escapeHtml(q.text || "")}</legend>
            <div class="flex flex-col gap-2">${optionsHtml}</div>
          </fieldset>`);
      });
      submitBtn.classList.remove("hidden");
      startTimer();
    } catch (e) {
      titleEl.textContent = "حدث خطأ في التحميل";
      console.error(e);
    }
  }

  let timerInterval = null;
  function startTimer() {
    if (!examData.duration) return;
    let remaining = examData.duration * 60;
    const timerBox = document.getElementById("examTimer");
    timerBox.classList.remove("hidden");
    function render() {
      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      timerBox.textContent = `⏱️ الوقت المتبقي: ${m}:${s}`;
      if (remaining <= 60) timerBox.style.color = "var(--danger)";
    }
    render();
    timerInterval = setInterval(() => {
      remaining--;
      render();
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerBox.textContent = "⏱️ انتهى الوقت! جاري تسليم إجاباتك...";
        submitExam();
      }
    }, 1000);
  }

  submitBtn.addEventListener("click", () => submitExam());

  async function submitExam() {
    if (timerInterval) clearInterval(timerInterval);
    const nameInput = document.getElementById("studentName");
    if (!session && nameInput && !nameInput.value.trim()) {
      nameInput.focus();
      nameInput.classList.add("ring-2");
      return;
    }
    let correct = 0;
    const questions = examData.questions || [];
    questions.forEach((q, i) => {
      const chosen = form.querySelector(`input[name="q${i}"]:checked`);
      const fieldset = form.querySelector(`fieldset[data-qindex="${i}"]`);
      fieldset.querySelectorAll("input").forEach(inp => inp.disabled = true);
      const chosenVal = chosen ? Number(chosen.value) : -1;
      const isCorrect = chosenVal === q.correctIndex;
      if (isCorrect) correct++;
      fieldset.querySelectorAll(".option-row").forEach((row, oi) => {
        if (oi === q.correctIndex) row.classList.add("result-correct");
        else if (oi === chosenVal && !isCorrect) row.classList.add("result-wrong");
      });
      if (!isCorrect) {
        const correctText = q.type === "tf"
          ? (q.correctIndex === 0 ? "صح" : "خطأ")
          : (q.options || [])[q.correctIndex];
        fieldset.insertAdjacentHTML("beforeend", `
          <div class="text-sm mt-2 p-2 rounded-lg" style="background:#eaf5ec;color:var(--success)">
            ✅ التصويب: الإجابة الصحيحة هي "${escapeHtml(correctText || "")}"
          </div>`);
      }
    });
    submitBtn.classList.add("hidden");
    const pct = questions.length ? Math.round((correct / questions.length) * 100) : 0;
    document.getElementById("resultBox").classList.remove("hidden");
    document.getElementById("scoreText").textContent = `${correct} / ${questions.length} (${pct}%)`;
    document.getElementById("resultBox").scrollIntoView({ behavior: "smooth" });

    if (session) {
      try {
        await addDoc(collection(db, "examResults"), {
          studentId: session.id,
          studentName: session.name,
          examId: id,
          examTitle: examData.title || "امتحان",
          grade: examData.grade,
          score: correct,
          total: questions.length,
          createdAt: Date.now()
        });
      } catch (e) {
        console.error(e);
      }
    }
  }

  load();
</script>
</body>
</html>
